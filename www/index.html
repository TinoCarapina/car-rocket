:root{--bg:#0e1730;--ink:#f4f7ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#070d1c}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#stage{height:100%;display:flex;align-items:center;justify-content:center}
#frame{position:relative;overflow:hidden;border-radius:14px}
#c{display:block;width:100%;height:100%;touch-action:none}
#ui,#ad,#shr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:linear-gradient(#070d1cd0,#0b1326f0)}
#ui.on,#ad.on,#shr.on{display:flex}

p{margin:0;opacity:.8;max-width:240px;line-height:1.35}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 22px;min-width:200px;color:#06101f;background:#38e1ff;cursor:pointer}
button.alt{background:#ffffff24;color:var(--ink)}

button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#snd{position:absolute;top:8px;right:8px;min-width:0;padding:5px 9px;font-size:12px;background:#ffffff24;color:var(--ink);z-index:2}
.big{font-size:64px;font-weight:700;line-height:1}
.sk{display:flex;align-items:center;gap:10px}.sk span{min-width:140px;font-weight:700}button.sm{min-width:0;padding:8px 16px}.req{font-size:12px}.row{display:flex;gap:8px;width:100%;max-width:270px}.row button{min-width:0;flex:1;padding:12px 8px}.nets{display:flex;gap:12px}.nb{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:0;background:none;color:var(--ink);font-size:11px;font-weight:600}.nb i{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px #ffffff40}.nb svg{width:28px;height:28px;fill:#fff}#shr img{max-height:42%;max-width:70%;border-radius:10px;box-shadow:0 0 0 1px #ffffff33}

(()=>{
const W=360,H=640,GY=H-64,$=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d'),frame=$('#frame'),ui=$('#ui'),adEl=$('#ad'),shr=$('#shr');
let best=0,muted=false,plays=0,skin=0,picked=0,adDue=false,newSkin='';
const SK=[{n:'Roadster red',a:'#ff4d63',b:'#a3122a',pl:0,sc:0},{n:'Glacier silver',a:'#eef3ff',b:'#7f8db3',pl:10,sc:25},{n:'Solar gold',a:'#ffe08a',b:'#b9801a',pl:25,sc:40},{n:'Midnight violet',a:'#a77bff',b:'#3b1d8f',pl:50,sc:60},{n:'Platinum gold',a:'#e5e4e2',b:'#d4a537',pl:0,sc:100,p:1}];
const ok=s=>plays>=s.pl&&best>=s.sc&&(!s.p||SK.every(k=>k.p||(plays>=k.pl&&best>=k.sc))),saveSkin=()=>{try{localStorage.setItem('vg_skin',picked)}catch(e){}};
try{best=+localStorage.getItem('vg_best')||0;plays=+localStorage.getItem('vg_plays')||0;const s=+localStorage.getItem('vg_skin')||0;if(SK[s]&&ok(SK[s]))skin=picked=s}catch(e){}

/* ---- Monetization: real AdMob + RevenueCat inside the app, demo placeholders in a browser ---- */
const CFG=window.VG_CONFIG||{},NAT=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const PL=NAT?Capacitor.getPlatform():'web',AM=NAT?Capacitor.Plugins.AdMob:null,RC=NAT?Capacitor.Plugins.Purchases:null,IDS=(CFG.ads||{})[PL]||{};
function demoAd(label,ms){return new Promise(res=>{adEl.innerHTML='<h1 style="font-size:24px">'+label+'</h1><p>Placeholder. A real ad SDK plugs in here.</p>';adEl.classList.add('on');setTimeout(()=>{adEl.classList.remove('on');res()},ms)})}
let adsReady=false;
async function adInit(){
 if(!AM||adsReady)return;
 try{
  try{const ci=await AM.requestConsentInfo();if(ci&&ci.isConsentFormAvailable&&ci.status==='REQUIRED')await AM.showConsentForm()}catch(e){}
  if(PL==='ios'){try{await AM.requestTrackingAuthorization()}catch(e){}}
  await AM.initialize({});adsReady=true}catch(e){}}
const M={adsRemoved:false,
 async init(){adInit();
  if(RC&&CFG.revenuecat&&CFG.revenuecat[PL]){try{await RC.configure({apiKey:CFG.revenuecat[PL]});const r=await RC.getCustomerInfo();this.sync(r.customerInfo)}catch(e){}}},
 sync(ci){const en=ci&&ci.entitlements&&ci.entitlements.active;if(en&&en[CFG.entitlement||'no_ads']){this.adsRemoved=true;try{localStorage.setItem('vg_noads','1')}catch(e){}}},
 async showInterstitial(){
  if(this.adsRemoved)return;
  if(!NAT){if(CFG.webDemoAds===false)return;return demoAd('Interstitial ad (demo)',1200)}
  try{await adInit();await AM.prepareInterstitial({adId:IDS.interstitial,isTesting:!!CFG.testMode});await AM.showInterstitial()}catch(e){}},
 async showRewarded(){
  if(!NAT){if(CFG.webDemoAds===false)return true;return demoAd('Rewarded ad (demo)',1800).then(()=>true)}
  return new Promise(async res=>{
   let earned=false;const hs=[];
   const done=()=>{hs.forEach(h=>{try{h.remove()}catch(e){}});res(earned)};
   try{await adInit();
    hs.push(await AM.addListener('onRewardedVideoAdReward',()=>{earned=true}));
    hs.push(await AM.addListener('onRewardedVideoAdDismissed',done));
    hs.push(await AM.addListener('onRewardedVideoAdFailedToShow',done));
    await AM.prepareRewardVideoAd({adId:IDS.rewarded,isTesting:!!CFG.testMode});await AM.showRewardVideoAd()}catch(e){done()}})},
 async buyRemoveAds(){
  if(!NAT){this.adsRemoved=true;try{localStorage.setItem('vg_noads','1')}catch(e){}return true}
  try{const o=await RC.getOfferings(),pkg=o.current&&o.current.availablePackages[0];if(!pkg)return false;const r=await RC.purchasePackage({aPackage:pkg});this.sync(r.customerInfo)}catch(e){}
  return this.adsRemoved},
 async restore(){if(!RC)return;try{const r=await RC.restorePurchases();this.sync(r.customerInfo)}catch(e){}}};
try{M.adsRemoved=localStorage.getItem('vg_noads')==='1'}catch(e){}

function fit(){const r=$('#stage').getBoundingClientRect(),s=Math.min(r.width/W,r.height/H),d=Math.min(devicePixelRatio||1,2);
 frame.style.width=W*s+'px';frame.style.height=H*s+'px';cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
addEventListener('resize',fit);fit();

let ac;
function sfx(f,d=.1,type='sine',v=.07,slide=0,dl=0){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+dl;o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}
let eng;
function engine(on){try{if(!on||muted){if(eng)eng.g.gain.setTargetAtTime(0,ac.currentTime,.05);return}
 ac=ac||new(window.AudioContext||window.webkitAudioContext)();
 if(!eng){const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=80;f.type='lowpass';f.frequency.value=420;g.gain.value=0;o.connect(f);f.connect(g);g.connect(ac.destination);o.start();eng={o,g}}
 eng.g.gain.setTargetAtTime(.03,ac.currentTime,.05)}catch(e){}}

let st='menu',car,obs,bats,pts=[],score,charge,spd=50,dist,gapNext,spawnN,batDue,revived,inv,shake=0,t=0,bgx=0,reason='',runs=0,busy=0;
const stars=Array.from({length:36},()=>[Math.random()*W,Math.random()*GY*.55,Math.random()*1.4+.4]);
const bld=Array.from({length:24},(_,i)=>({w:30+(i*37)%28,h:50+(i*53)%100})),tile=bld.reduce((a,b)=>a+b.w+4,0);
const clouds=[{x:30,y:130,s:1},{x:200,y:200,s:.7},{x:320,y:90,s:1.3},{x:120,y:260,s:.8}];
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function reset(){car={x:96,y:280,vy:0,fl:0,iv:0,rt:0};obs=[];bats=[];pts=[];score=0;charge=100;dist=-60;gapNext=250;spawnN=0;batDue=false;revived=false;inv=0}
function burst(x,y,n,c,sp){for(let i=0;i<n;i++)pts.push({x,y,vx:(Math.random()-.5)*sp*2,vy:(Math.random()-.5)*sp*2,l:.4+Math.random()*.5,c})}

function spawn(){
 const x=W+50,n=spawnN++,r=Math.random();let k;
 if(score<3)k=r<.4?'tree':r<.75?'building':'bird';
 else if(score<7)k=r<.25?'tree':r<.45?'building':r<.7?'bird':'crane';
 else k=r<.15?'tree':r<.3?'building':r<.5?'bird':r<.7?'crane':'pair';
 if(k==='tree')obs.push({k,x,w:54,h:80+Math.random()*60,r:Math.random()<.5});
 else if(k==='building')obs.push({k,x,w:64+(Math.random()*20|0),h:110+Math.random()*110,s:Math.random()*99|0});
 else if(k==='bird')obs.push({k,x,w:32,by:150+Math.random()*(GY-330),y:200,ph:Math.random()*6});
 else if(k==='crane')obs.push({k,x,w:36,len:140+Math.random()*130});
 else{const h=90+Math.random()*100,gap=Math.max(175,215-score),len=Math.max(50,GY-h-gap);
  obs.push({k:'building',x,w:70,h,s:Math.random()*99|0},{k:'crane',x:x+17,w:36,len,ns:true})}
 if(n%3===2||charge<40)batDue=true;
}
function rects(o){
 if(o.k==='tree')return[{x:o.x+10,y:GY-o.h,w:o.w-20,h:o.h}];
 if(o.k==='building')return[{x:o.x,y:GY-o.h,w:o.w,h:o.h}];
 if(o.k==='bird')return[{x:o.x+3,y:o.y-9,w:o.w-6,h:18}];
 return[{x:o.x+o.w/2-4,y:0,w:8,h:o.len},{x:o.x,y:o.len,w:o.w,h:28}]}

function flap(){
 if(st!=='play')return;
 if(charge<=0){sfx(110,.1,'square',.05);return}
 car.vy=-330*(charge<20?.85:1);car.fl=1;charge=Math.max(0,charge-1.4);
 sfx(210,.14,'sawtooth',.03,260);burst(car.x-6,car.y+12,2,'#38e1ff',40)}

let lastFrame=null;

 const sk=SK[idx],gold=!!sk.p,F=(w,px)=>w+' '+px+'px "Chakra Petch",system-ui,sans-serif';

 const s2=$('#shr2');if(s2)s2.onclick=()=>shareCard('skin',picked);
 const s3=$('#shk');if(s3)s3.onclick=()=>shareCard('skin',skin);
 const n=$('#noads');if(n)n.onclick=async()=>{await M.buyRemoveAds();show(m)};const rs=$('#rest');if(rs)rs.onclick=async()=>{await M.restore();show(m)}}
async function start(){if(busy)return;busy=1;if(adDue){adDue=false;await M.showInterstitial()}reset();ui.classList.remove('on');st='play';car.vy=-300;engine(true);loadBat();busy=0}
async function revive(){if(busy)return;busy=1;if(!(await M.showRewarded())){busy=0;return}obs=obs.filter(o=>o.x>car.x+330);bats=[];pts=[];charge=60;car.y=260;car.vy=0;inv=1.8;revived=true;dist=0;adDue=false;ui.classList.remove('on');st='play';engine(true);busy=0}

let gs=null;
function isCircle(pts){const n=pts.length;if(n<10)return false;let cx=0,cy=0;for(const q of pts){cx+=q[0];cy+=q[1]}cx/=n;cy/=n;
 let r=0;for(const q of pts)r+=Math.hypot(q[0]-cx,q[1]-cy);r/=n;if(r<9||r>90)return false;
 let sd=0;for(const q of pts)sd+=Math.abs(Math.hypot(q[0]-cx,q[1]-cy)-r);if(sd/n/r>.35)return false;
 let sw=0,pa=Math.atan2(pts[0][1]-cy,pts[0][0]-cx);for(let i=1;i<n;i++){const a=Math.atan2(pts[i][1]-cy,pts[i][0]-cx);let d=a-pa;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;sw+=d;pa=a}
 return Math.abs(sw)>5.4}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}
 const g={x:e.clientX,y:e.clientY,pts:[[e.clientX,e.clientY]],gest:false,fl:false,done:false};
 g.t=setTimeout(()=>{if(!g.gest&&!g.fl&&!g.done){g.fl=true;flap()}},55);gs=g});
cv.addEventListener('pointermove',e=>{const g=gs;if(!g||g.done)return;g.pts.push([e.clientX,e.clientY]);if(g.pts.length>90)g.pts.shift();
 if(!g.gest&&Math.hypot(e.clientX-g.x,e.clientY-g.y)>7)g.gest=true;
 if(g.gest&&isCircle(g.pts)){g.done=true;clearTimeout(g.t);flip()}});
cv.addEventListener('pointerup',()=>{const g=gs;gs=null;if(!g)return;clearTimeout(g.t);if(!g.fl&&!g.done){g.fl=true;flap()}});
cv.addEventListener('pointercancel',()=>{if(gs){clearTimeout(gs.t);gs=null}});
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&!e.repeat){e.preventDefault();if(st==='play')flap();else if(ui.classList.contains('on')&&!shr.classList.contains('on')){const g=$('#go');if(g)g.click()}}});

let last=performance.now();
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{if(ac){try{document.hidden?ac.suspend():ac.resume()}catch(e){}}});
if('serviceWorker' in navigator&&!isNative()&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
M.init();reset();show('menu');requestAnimationFrame(loop);
})();
